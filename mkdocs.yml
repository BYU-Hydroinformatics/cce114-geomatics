site_name: CCE 114 — Geomatics
site_description: Course materials for Civil and Construction Engineering 114 (Geomatics) at BYU
site_url: https://byu-hydroinformatics.github.io/cce114-geomatics/
repo_url: https://github.com/BYU-Hydroinformatics/cce114-geomatics
repo_name: BYU-Hydroinformatics/cce114-geomatics

theme:
  name: material
  features:
    - navigation.tabs          # one tab per top-level section; the sidebar shows only that section
    - navigation.tabs.sticky
    - navigation.indexes       # a section's first bare entry is the section's own page
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/map

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - gh-admonitions

hooks:
  - tools/page_version.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tilde
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Course Overview: course.md
  - Schedule:
      - Overview: schedule.md
      - "Week 1 — Introduction": weeks/week-01.md
      - "Week 2 — GIS Data Models": weeks/week-02.md
      - "Week 3 — Maps, Symbology, and Cartography": weeks/week-03.md
      - "Week 4 — The Global Positioning System": weeks/week-04.md
      - "Week 5 — Working with Vector Data": weeks/week-05.md
      - "Week 6 — Working with Raster Data": weeks/week-06.md
      - "Week 7 — Finding Spatial Data and Web Services": weeks/week-07.md
      - "Week 8 — Geodesy, Projections, and Coordinate Systems": weeks/week-08.md
      - "Week 9 — Metadata": weeks/week-09.md
      - "Week 10 — Geoprocessing": weeks/week-10.md
      - "Week 11 — Geoplanning and Georeferencing": weeks/week-11.md
      - "Week 12 — Project Site Selection": weeks/week-12.md
      - "Week 13 — Final Project": weeks/week-13.md
      - "Week 14 — Final Project": weeks/week-14.md
      - "Week 15 — Presentations and Exam Review": weeks/week-15.md
  - Assignments:
      - assignments/README.md
      - Lab 1 — Getting Started with GIS: assignments/lab-01/README.md
      - Lab 2 — Map Symbology and Layouts: assignments/lab-02/README.md
      - Lab 3 — GPS Data Collection: assignments/lab-03/README.md
      - Lab 4 — Changing, Editing, Fixing Data: assignments/lab-04/README.md
      - Lab 5 — Working with Raster Data: assignments/lab-05/README.md
      - Lab 6 — Spatial Data Web Services: assignments/lab-06/README.md
      - Lab 7 — Projections & Coordinate Systems: assignments/lab-07/README.md
      - Lab 8 — Metadata: assignments/lab-08/README.md
      - Lab 9 — The Yellowstone Disaster: assignments/lab-09/README.md
      - Lab 10 — Domes for Mozambique: assignments/lab-10/README.md
      - Lab 11 — Walmart Site Selection: assignments/lab-11/README.md
      - Quizzes, Activities & Experiences: assignments/deliverables.md
      - Web Mapping with AI Experience: assignments/web-mapping-with-ai.md
      - Final Project: assignments/final-project.md
  - Policies:
      - Grading: policies/grading.md
      - Attendance & Participation: policies/attendance.md
      - Exams: policies/exams.md
      - AI Use Policy: policies/ai-policy.md
      - University Policies: policies/university.md
