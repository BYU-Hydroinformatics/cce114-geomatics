<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Agreement is not the same as accuracy</title><desc id="desc">Illustrative targets show a tight cluster displaced from a known position and a scattered group around a known position. More decimal digits do not ensure accuracy. The target is a hypothetical known reference, not a surveyed campus point.</desc>
<rect width="1200" height="410" rx="24" fill="#f3f6fa"/>
<g font-family="Arial,sans-serif" fill="#17394c"><text x="32" y="46" font-size="28" font-weight="700">Close together… but close to what?</text><text x="32" y="76" font-size="17">Concept sketch · the cross marks a hypothetical known reference position.</text>
<g fill="white" stroke="#c7d7e3" stroke-width="2"><circle cx="178" cy="204" r="95"/><circle cx="178" cy="204" r="61"/><circle cx="178" cy="204" r="28"/><circle cx="575" cy="204" r="95"/><circle cx="575" cy="204" r="61"/><circle cx="575" cy="204" r="28"/></g>
<g stroke="#17394c" stroke-width="3"><path d="M166 204h24m-12-12v24M563 204h24m-12-12v24"/></g>
<g fill="#e5763f" stroke="white" stroke-width="2"><circle cx="231" cy="159" r="8"/><circle cx="247" cy="170" r="8"/><circle cx="226" cy="178" r="8"/><circle cx="242" cy="188" r="8"/><circle cx="255" cy="157" r="8"/>
<circle cx="528" cy="158" r="8"/><circle cx="601" cy="167" r="8"/><circle cx="556" cy="249" r="8"/><circle cx="626" cy="220" r="8"/><circle cx="575" cy="213" r="8"/></g>
<text x="39" y="333" font-size="22" font-weight="700">Tight group, shifted location</text><text x="39" y="366" font-size="18">The readings agree; a shared bias remains.</text>
<text x="429" y="333" font-size="22" font-weight="700">Spread around the reference</text><text x="429" y="366" font-size="18">Individual readings still disagree.</text>
<rect x="816" y="110" width="350" height="190" rx="18" fill="#dff1e9"/><text x="841" y="156" font-size="25" font-weight="700">40.24632328°</text><text x="841" y="198" font-size="20">Lots of digits?</text><text x="841" y="231" font-size="20">Keep them. But they are</text><text x="841" y="264" font-size="20">not a promise of accuracy.</text><text x="827" y="333" font-size="22" font-weight="700">Our class has no target cross.</text><text x="827" y="366" font-size="18">Measure agreement; discuss uncertainty.</text>
</g></svg>
