<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCE 114 — %%TITLE%%</title>
  <meta name="theme-color" content="#002e5d">
  <meta name="description" content="%%DESCRIPTION%%">
  <link rel="stylesheet" href="../assets/quiz.css">
</head>
<body>

<div class="container">
  <header>
    <h1>%%TITLE%%</h1>
    <p class="subtitle">CCE 114 &middot; Day %%DAY%% &mdash; %%TOPIC%%<br>
      %%BLURB%%</p>
  </header>

  <div class="score-bar" id="scoreBar">
    <span id="progressText">Question 1 of %%N%%</span>
    <span id="scoreText">Score: 0 / 0</span>
  </div>

  <div class="quiz-card" id="quizCard">
    <div id="quizContent">
      <div class="section-badge" id="sectionBadge">Part 1</div>
      <div class="prompt" id="promptText">Question</div>
      <div class="setup" id="setupText"></div>

      <div class="options" id="optionsBox"></div>

      <div class="feedback" id="feedbackBox"></div>

      <div class="controls">
        <button class="next-btn" id="nextBtn">Next &rarr;</button>
      </div>
    </div>

    <div class="final-screen" id="finalScreen">
      <h2>Done</h2>
      <div class="final-score" id="finalScoreDisplay">0 / %%N%%</div>
      <p id="finalFeedbackText" style="color: var(--muted); margin-bottom: 1rem;"></p>
      <div class="checklist">
%%CLOSING%%
      </div>
      <br>
      <button class="restart-btn" id="restartBtn">Start over</button>
    </div>
  </div>

  <footer class="page-foot">
    CCE 114 Geomatics &middot;
    <a href="../../">Course site</a> &middot;
    <a href="../../weeks/week-%%WEEK2%%/">Week %%WEEK%%</a>
  </footer>
</div>

<script type="application/json" id="quizData">
%%DATA%%
</script>
<script src="../assets/quiz.js"></script>

</body>
</html>
