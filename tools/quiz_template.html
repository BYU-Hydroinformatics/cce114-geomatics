<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCE 114 — %%TITLE%%</title>
  <meta name="theme-color" content="#002e5d">
  <meta name="description" content="%%DESCRIPTION%%">
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --primary: #002e5d;          /* BYU navy, the course site's primary */
      --primary-hover: #001f3f;
      --accent: #0062b8;
      --success: #0f7b3f;
      --success-bg: #f0faf4;
      --success-text: #0b4f29;
      --danger: #b3261e;
      --danger-bg: #fdf2f1;
      --danger-text: #7a1a15;
      --border: #dde3ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container { max-width: 680px; width: 100%; }

    header { text-align: center; margin-bottom: 1.5rem; }

    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; color: var(--primary); }

    p.subtitle { color: var(--muted); font-size: 0.95rem; line-height: 1.45; }

    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .quiz-card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .section-badge {
      display: inline-block;
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .prompt {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      color: #10243a;
    }

    .setup {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.4rem;
      line-height: 1.45;
    }

    .options { display: grid; gap: 0.7rem; margin-bottom: 1.25rem; }

    button.opt-btn {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      width: 100%;
      text-align: left;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      line-height: 1.35;
      font-weight: 500;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    button.opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--primary);
      background: #eef5fc;
    }

    button.opt-btn:disabled { cursor: default; }

    .opt-letter {
      flex: 0 0 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    button.correct {
      background: var(--success) !important;
      border-color: var(--success) !important;
      color: #ffffff !important;
    }

    button.incorrect {
      background: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #ffffff !important;
    }

    button.correct .opt-letter,
    button.incorrect .opt-letter { color: #ffffff; }

    .feedback {
      display: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.45;
      margin-bottom: 1.25rem;
    }

    .feedback.visible { display: block; }

    .feedback.correct-box {
      background-color: var(--success-bg);
      border-left: 4px solid var(--success);
      color: var(--success-text);
    }

    .feedback.incorrect-box {
      background-color: var(--danger-bg);
      border-left: 4px solid var(--danger);
      color: var(--danger-text);
    }

    .feedback strong { display: block; margin-bottom: 0.25rem; }

    .controls { display: flex; justify-content: flex-end; }

    button.next-btn {
      padding: 0.65rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }

    button.next-btn:hover { background: var(--primary-hover); }

    .final-screen { display: none; text-align: center; padding: 2rem 1rem; }

    .final-screen h2 { font-size: 1.5rem; margin-bottom: 0.75rem; color: var(--primary); }

    .final-score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .checklist {
      text-align: left;
      display: inline-block;
      margin: 0.5rem auto 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    button.restart-btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1.5rem;
    }

    footer.page-foot {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer.page-foot a { color: var(--muted); }

    /* Phones: this quiz is meant to be scanned off a slide and answered on a handset. */
    @media (max-width: 480px) {
      body { padding: 1rem 0.75rem; }
      h1 { font-size: 1.25rem; }
      .quiz-card { padding: 1.1rem; }
      .prompt { font-size: 1.05rem; }
      .options { gap: 0.55rem; }
      button.opt-btn { padding: 0.9rem 0.7rem; font-size: 0.95rem; }
      .controls { justify-content: stretch; }
      button.next-btn { width: 100%; padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>%%TITLE%%</h1>
    <p class="subtitle">CCE 114 &middot; Day %%DAY%% &mdash; %%TOPIC%%<br>
      %%BLURB%%</p>
  </header>

  <div class="score-bar" id="scoreBar">
    <span id="progressText">Question 1 of %%N%%</span>
    <span id="scoreText">Score: 0 / 0</span>
  </div>

  <div class="quiz-card" id="quizCard">
    <div id="quizContent">
      <div class="section-badge" id="sectionBadge">Part 1</div>
      <div class="prompt" id="promptText">Question</div>
      <div class="setup" id="setupText"></div>

      <div class="options" id="optionsBox"></div>

      <div class="feedback" id="feedbackBox"></div>

      <div class="controls">
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next &rarr;</button>
      </div>
    </div>

    <div class="final-screen" id="finalScreen">
      <h2>Done</h2>
      <div class="final-score" id="finalScoreDisplay">0 / %%N%%</div>
      <p id="finalFeedbackText" style="color: var(--muted); margin-bottom: 1rem;"></p>
      <div class="checklist">
%%CLOSING%%
      </div>
      <br>
      <button class="restart-btn" onclick="restartQuiz()">Start over</button>
    </div>
  </div>

  <footer class="page-foot">
    CCE 114 Geomatics &middot;
    <a href="../../">Course site</a> &middot;
    <a href="../../weeks/week-%%WEEK2%%/">Week %%WEEK%%</a>
  </footer>
</div>

<script>
%%QUESTIONS%%
  const LETTERS = ["A", "B", "C", "D", "E", "F"];

  let currentIndex = 0;
  let score = 0;
  let answered = false;

  const sectionBadge = document.getElementById("sectionBadge");
  const promptText = document.getElementById("promptText");
  const setupText = document.getElementById("setupText");
  const optionsBox = document.getElementById("optionsBox");
  const feedbackBox = document.getElementById("feedbackBox");
  const nextBtn = document.getElementById("nextBtn");
  const progressText = document.getElementById("progressText");
  const scoreText = document.getElementById("scoreText");
  const quizContent = document.getElementById("quizContent");
  const finalScreen = document.getElementById("finalScreen");
  const finalScoreDisplay = document.getElementById("finalScoreDisplay");
  const finalFeedbackText = document.getElementById("finalFeedbackText");
  const scoreBar = document.getElementById("scoreBar");

  function loadQuestion() {
    answered = false;
    const q = questions[currentIndex];

    sectionBadge.textContent = q.section;
    promptText.textContent = q.prompt;
    setupText.textContent = q.setup || "";
    setupText.style.display = q.setup ? "block" : "none";

    optionsBox.innerHTML = "";
    q.options.forEach(function (text, i) {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerHTML = '<span class="opt-letter">' + LETTERS[i] + '</span><span></span>';
      btn.lastChild.textContent = text;
      btn.onclick = function () { checkAnswer(i); };
      optionsBox.appendChild(btn);
    });

    feedbackBox.className = "feedback";
    feedbackBox.innerHTML = "";
    nextBtn.style.display = "none";

    progressText.textContent = "Question " + (currentIndex + 1) + " of " + questions.length;
  }

  function checkAnswer(selected) {
    if (answered) return;
    answered = true;

    const q = questions[currentIndex];
    const isCorrect = selected === q.correct;
    if (isCorrect) score++;

    scoreText.textContent = "Score: " + score + " / " + (currentIndex + 1);

    const btns = optionsBox.querySelectorAll("button.opt-btn");
    btns.forEach(function (btn, i) {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add("correct");
      if (i === selected && !isCorrect) btn.classList.add("incorrect");
    });

    feedbackBox.classList.add("visible");
    feedbackBox.classList.add(isCorrect ? "correct-box" : "incorrect-box");
    const head = (isCorrect ? "✓ Correct" : "✗ Not quite") +
                 " — " + LETTERS[q.correct] + ". " + q.options[q.correct];
    feedbackBox.innerHTML = "<strong></strong>";
    feedbackBox.firstChild.textContent = head;
    feedbackBox.appendChild(document.createTextNode(q.explanation));

    nextBtn.textContent = (currentIndex === questions.length - 1) ? "See how you did" : "Next →";
    nextBtn.style.display = "inline-block";
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizContent.style.display = "none";
    scoreBar.style.display = "none";
    finalScreen.style.display = "block";

    finalScoreDisplay.textContent = score + " / " + questions.length;

    if (score === questions.length) {
      finalFeedbackText.textContent = %%MSG_TOP%%;
    } else if (score >= 9) {
      finalFeedbackText.textContent = %%MSG_MID%%;
    } else {
      finalFeedbackText.textContent = %%MSG_LOW%%;
    }
  }

  function restartQuiz() {
    currentIndex = 0;
    score = 0;
    scoreBar.style.display = "flex";
    quizContent.style.display = "block";
    finalScreen.style.display = "none";
    scoreText.textContent = "Score: 0 / 0";
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
